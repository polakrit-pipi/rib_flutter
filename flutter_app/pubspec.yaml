name: rib_scanner
description: Rib 9 Overlap Lung Scanner - AI-powered chest X-ray analysis app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.0

  # Image picking from gallery / camera
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Circular progress indicator
  percent_indicator: ^4.2.3

  # Dotted border for upload area
  dotted_border: ^2.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
